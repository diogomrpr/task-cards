  <rect x="540" y="185" width="550" height="316" rx="12" fill="#242428" stroke="#45454c"/>
  <text x="580" y="238" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600">Compact and predictable</text>
  <text x="580" y="282" fill="#c3c3c3" font-family="Segoe UI, sans-serif" font-size="16">• Borderless, fixed-size task cards</text>
  <text x="580" y="322" fill="#c3c3c3" font-family="Segoe UI, sans-serif" font-size="16">• Nested folders with one-click ordered runs</text>
  <text x="580" y="362" fill="#c3c3c3" font-family="Segoe UI, sans-serif" font-size="16">• Slow red pulse and direct stop control while running</text>
  <text x="580" y="402" fill="#c3c3c3" font-family="Segoe UI, sans-serif" font-size="16">• Automatic refresh whenever tasks.json changes</text>
  <text x="580" y="442" fill="#c3c3c3" font-family="Segoe UI, sans-serif" font-size="16">• Theme-aware, keyboard-accessible UI</text>
  <text x="580" y="482" fill="#c3c3c3" font-family="Segoe UI, sans-serif" font-size="16">• Safe browsing in Restricted Mode</text>
