  <text x="94" y="166" fill="#d7d7d7" font-family="Segoe UI, sans-serif" font-size="14" font-weight="500">⌄  HTML</text>
  <text x="458" y="166" text-anchor="middle" fill="#c8c8c8" font-family="Segoe UI, sans-serif" font-size="14">▶</text>

  <g transform="translate(94 176)">
    <rect width="188" height="48" rx="6" fill="#303036"/>
    <text x="10" y="30" fill="#ffffff" font-family="Segoe UI Emoji, Segoe UI, sans-serif" font-size="18">🧩</text>
    <text x="38" y="29" fill="#eeeeee" font-family="Segoe UI, sans-serif" font-size="14">Build customization</text>
  </g>
  <g transform="translate(288 176)">
    <rect width="188" height="48" rx="6" fill="#303036"/>
    <text x="10" y="30" fill="#ffffff" font-family="Segoe UI Emoji, Segoe UI, sans-serif" font-size="18">🌐</text>
    <text x="38" y="29" fill="#eeeeee" font-family="Segoe UI, sans-serif" font-size="14">Build HTML</text>
  </g>
  <g transform="translate(80 230)">
    <rect width="195" height="48" rx="6" fill="#303036"/>
    <text x="10" y="30" fill="#ffffff" font-family="Segoe UI Emoji, Segoe UI, sans-serif" font-size="18">🔨</text>
