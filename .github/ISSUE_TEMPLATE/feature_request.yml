name: Feature request
description: Suggest a focused improvement to Task Cards.
title: "[Feature]: "
body:
  - type: textarea
    attributes:
      label: Problem
      description: What task-management problem should this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and an example tasks.json entry if relevant.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Scope
      options:
        - label: This remains specific to official desktop VS Code and workspace tasks.json files.
          required: true
